<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Team Task Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <nav class="navbar navbar-dark bg-primary" id="main-nav">
        <div class="container-fluid">
            <span class="navbar-brand">TaskFlow</span>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <div class="col-12 col-md-10 col-lg-8 mx-auto" id="main-content">

                <h4 id="page-title">Team Tasks</h4>

                <!-- Create Task -->
                <div class="card" id="create-task-card">
                    <div class="card-header">
                        <h6>Create New Task</h6>
                    </div>

                    <div class="card-body">
                        <form id="taskForm">

                            <div class="mb-3">
                                <label for="taskTitle" class="form-label">Task</label>
                                <input
                                    type="text"
                                    class="form-control"
                                    id="taskTitle"
                                    placeholder="Enter task"
                                    required
                                >
                            </div>

                            <div class="mb-3">
                                <label for="taskDescription" class="form-label">
                                    Description
                                </label>
                                <textarea
                                    class="form-control"
                                    id="taskDescription"
                                    placeholder="Enter description"
                                    required
                                ></textarea>
                            </div>

                            <div class="mb-3">
                                <label for="dueDate" class="form-label">Due Date</label>
                                <input
                                    type="date"
                                    class="form-control"
                                    id="dueDate"
                                    required
                                >
                            </div>

                            <div class="mb-3">
                                <label for="assignedTo" class="form-label">
                                    Assigned To
                                </label>

                                <select
                                    class="form-select"
                                    id="assignedTo"
                                    required
                                >
                                    <option value="">Select team member</option>
                                    <option value="Alberto">Alberto</option>
                                    <option value="John">John</option>
                                    <option value="Maria">Maria</option>
                                    <option value="Sarah">Sarah</option>
                                    <option value="David">David</option>
                                </select>
                            </div>

                            <button type="submit" class="btn btn-primary">
                                Add Task
                            </button>

                        </form>
                    </div>
                </div>

                <!-- Task List -->
                <h6 id="task-list-title" class="mt-4">Current Tasks</h6>

                <div id="taskList"></div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
